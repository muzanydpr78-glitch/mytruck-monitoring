<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');
:root{color-scheme:light;--bg:#f5f8fc;--panel:#fff;--text:#152b45;--muted:#74859a;--line:#e3ebf4;--field:#f8fafd;--blue:#2679d9;--blue2:#5eb4ff;--shadow:0 24px 70px rgba(36,77,122,.10);--soft:#eaf4ff;--art:#dceeff;--road:#c5dcf4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}
body.dark{color-scheme:dark;--bg:#0d1725;--panel:#121f30;--text:#e8f1fb;--muted:#92a5bb;--line:#26384d;--field:#0d1928;--blue:#64b1ff;--blue2:#91cbff;--shadow:0 24px 70px rgba(0,0,0,.25);--soft:#172c42;--art:#142b43;--road:#1e3a56}
button,input{font:inherit}
button{cursor:pointer}
.app-shell{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.04fr) minmax(460px,.96fr);padding:18px;gap:18px;max-width:1720px;margin:0 auto}
.visual-panel{position:relative;min-height:calc(100vh - 36px);overflow:hidden;border-radius:28px;background:linear-gradient(145deg,#edf7ff 0%,#dbeeff 50%,#c6e2ff 100%);padding:36px 42px;display:flex;flex-direction:column;color:#183b60}
body.dark .visual-panel{background:linear-gradient(145deg,#12273d 0%,#173552 55%,#1b4568 100%);color:#eaf5ff}
.brand{display:flex;align-items:center;gap:12px;position:relative;z-index:2}
.brand-mark{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,#5bb4ff,#2372cf);box-shadow:0 9px 22px #4596e94d;color:white;display:grid;place-items:center;font:800 23px Manrope,sans-serif}
.brand-name{font:800 16px Manrope,sans-serif;letter-spacing:-.4px}.brand-subtitle{font-size:9px;font-weight:700;letter-spacing:2px;opacity:.58;margin-top:3px}
.visual-copy{position:relative;z-index:2;margin-top:clamp(52px,8vh,100px);max-width:520px}
.eyebrow{font-size:10px;font-weight:800;letter-spacing:2px;display:flex;align-items:center;gap:9px;color:#3276b8}
body.dark .eyebrow{color:#8dc9ff}.eyebrow-dot{width:7px;height:7px;border-radius:50%;background:#3e9ce9;box-shadow:0 0 0 5px #56a9f21c}
h1{font:800 clamp(36px,4.2vw,64px)/1.08 Manrope,sans-serif;letter-spacing:-2.7px;margin:22px 0 18px}
h1 span{color:#398cdd}body.dark h1 span{color:#80c4ff}
.visual-copy p{font-size:15px;line-height:1.8;color:#52718f;max-width:420px;margin:0}body.dark .visual-copy p{color:#a8c1d9}
.fleet-art{position:relative;flex:1;min-height:260px;margin:0 -20px;overflow:hidden}
.sun-glow{position:absolute;width:300px;height:300px;border-radius:50%;right:12%;top:7%;background:#fff9;filter:blur(1px)}body.dark .sun-glow{background:#65b8ff12}
.road{position:absolute;border-radius:50%;transform:rotate(-9deg);border:2px solid #a9ccec}
.road-back{width:115%;height:230px;left:-7%;bottom:5%;background:var(--road);border-color:#b8d8f5}
.road-front{width:120%;height:160px;left:-10%;bottom:-5%;background:#b8d8f0;border-color:#a7c9e9}
body.dark .road-back{border-color:#2c4e6d}body.dark .road-front{border-color:#315979}
.route-line{position:absolute;z-index:1;width:120%;height:2px;left:-5%;bottom:20%;transform:rotate(-9deg);background:repeating-linear-gradient(90deg,#f8fcff 0 26px,transparent 26px 47px);opacity:.95}
.truck{position:absolute;z-index:2;width:min(92%,560px);right:2%;bottom:8%;filter:drop-shadow(0 18px 14px #3b6c9920)}
.truck-shadow{position:absolute;width:70%;height:22px;right:7%;bottom:12%;border-radius:50%;background:#244b711a;filter:blur(8px)}
.floating-card{position:absolute;z-index:3;display:flex;align-items:center;gap:10px;padding:12px 15px;border:1px solid #ffffffb8;background:#ffffffdc;backdrop-filter:blur(12px);border-radius:14px;box-shadow:0 12px 30px #396b971c;color:#24415f}
body.dark .floating-card{background:#142c43e8;border-color:#44637d;color:#e7f4ff}
.floating-card strong,.floating-card small{display:block}.floating-card strong{font-size:11px}.floating-card small{font-size:9px;color:#7188a1;margin-top:3px}
.status-icon,.route-icon{display:grid;place-items:center;width:30px;height:30px;border-radius:10px;background:#e0f4e9;color:#218b5b;font-weight:800}.route-icon{background:#e4f1ff;color:#2879ca;font-size:18px}
.card-status{top:15%;right:5%}.card-route{bottom:19%;left:2%}
.visual-footer{display:flex;align-items:center;gap:12px;font-size:9px;font-weight:800;letter-spacing:1.5px;opacity:.58;position:relative;z-index:3}.footer-line{height:1px;background:currentColor;opacity:.35;flex:1}
.login-panel{background:var(--panel);border:1px solid var(--line);border-radius:28px;position:relative;display:flex;align-items:center;justify-content:center;padding:70px clamp(28px,5vw,80px) 58px;box-shadow:var(--shadow);min-height:calc(100vh - 36px)}
.theme-toggle{position:absolute;right:28px;top:26px;border:1px solid var(--line);background:var(--field);color:var(--muted);border-radius:12px;padding:10px 12px;display:flex;gap:8px;align-items:center;font-size:11px;font-weight:700;transition:.2s}.theme-toggle:hover{border-color:var(--blue);color:var(--blue)}
.login-card{width:100%;max-width:410px}.mobile-brand{display:none;align-items:center;gap:10px;font:800 15px Manrope,sans-serif;margin-bottom:36px}
.mini-label{font-size:10px;letter-spacing:2px;font-weight:800;color:var(--blue);margin-bottom:14px}
h2{font:800 clamp(27px,2.4vw,35px)/1.2 Manrope,sans-serif;letter-spacing:-1.3px;margin:0 0 12px}
.login-heading p{font-size:13px;line-height:1.7;color:var(--muted);margin:0 0 32px}
form label{display:block;font-size:12px;font-weight:700;margin-bottom:10px}
.input-wrap{height:54px;display:flex;align-items:center;gap:11px;border:1px solid var(--line);background:var(--field);border-radius:13px;padding:0 14px;transition:.2s;margin-bottom:22px}
.input-wrap:focus-within{border-color:var(--blue);box-shadow:0 0 0 4px color-mix(in srgb,var(--blue) 12%,transparent)}
.field-icon{color:#8ba0b7;font-size:20px;width:18px;text-align:center}
.input-wrap input{min-width:0;flex:1;border:0;outline:0;background:transparent;color:var(--text);font-size:12px;height:100%}
.input-wrap input::placeholder{color:#9aabbd}
.password-label-row{display:flex;align-items:center;justify-content:space-between}
.password-toggle{border:0;background:transparent;color:var(--blue);font-size:11px;font-weight:800;padding:8px 0 8px 8px}
.form-options{display:flex;align-items:center;justify-content:space-between;margin:-2px 0 22px}
.remember-option{display:flex;align-items:center;gap:9px;cursor:pointer;margin:0;font-size:11px!important;font-weight:600!important;color:var(--muted)}
.remember-option input{position:absolute;opacity:0;width:1px;height:1px}
.custom-check{width:16px;height:16px;border:1px solid #cbd7e5;border-radius:5px;display:inline-grid;place-items:center;background:var(--field)}
.remember-option input:checked+.custom-check{background:var(--blue);border-color:var(--blue)}.remember-option input:checked+.custom-check:after{content:'✓';color:#fff;font-size:11px;font-weight:800}
.remember-note{font-size:10px;color:var(--muted)}
.message{font-size:12px;line-height:1.5;border-radius:10px;margin-bottom:0;color:#c44c4c}
.message:not(:empty){padding:10px 12px;margin-bottom:13px;background:#fff0f0;border:1px solid #ffd6d6}
body.dark .message:not(:empty){background:#3a2028;border-color:#63313d;color:#ffb4bd}
.submit-button{width:100%;height:54px;border:0;border-radius:13px;background:linear-gradient(100deg,#2a7bd7,#4ba8f8);color:white;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 10px 22px #3a8cdb30;transition:transform .2s,box-shadow .2s}
.submit-button:hover{transform:translateY(-1px);box-shadow:0 13px 26px #3a8cdb40}.submit-button:disabled{opacity:.65;cursor:wait;transform:none}
.button-arrow{font-size:18px;font-weight:500}
.login-footnote{display:flex;justify-content:center;align-items:center;gap:8px;font-size:10px;color:var(--muted);margin-top:27px}.lock-icon{font-size:13px}
.panel-bottom{position:absolute;bottom:23px;left:clamp(28px,5vw,80px);right:clamp(28px,5vw,80px);display:flex;justify-content:space-between;font-size:8px;font-weight:800;letter-spacing:1.3px;color:var(--muted);opacity:.75}
.signed-in-panel{text-align:center;padding-top:6px}.success-mark{margin:0 auto 18px;width:56px;height:56px;border-radius:18px;background:#e1f7ec;color:#168653;display:grid;place-items:center;font-size:26px;font-weight:800}.signed-in-panel h3{font:800 24px Manrope,sans-serif;margin:0 0 8px}.signed-in-panel p{font-size:12px;line-height:1.7;color:var(--muted)}
.user-meta{display:flex;align-items:center;justify-content:space-between;padding:14px;border:1px solid var(--line);border-radius:12px;margin:20px 0;text-align:left}.user-meta span{font-size:9px;letter-spacing:1.5px;color:var(--muted);font-weight:800}.user-meta strong{font-size:12px}
.placeholder-note{padding:12px;border-radius:10px;background:var(--soft)}.secondary-button{width:100%;height:48px;border:1px solid var(--line);border-radius:12px;background:var(--field);color:var(--text);font-weight:800;font-size:12px}
@media(max-width:1050px){.app-shell{grid-template-columns:.9fr 1.1fr}.visual-panel{padding:30px}.login-panel{padding-left:32px;padding-right:32px}.visual-copy{margin-top:60px}.card-status{right:0}.truck{width:105%;right:-5%}}
@media(max-width:760px){.app-shell{display:block;padding:0;min-height:100vh}.visual-panel{display:none}.login-panel{min-height:100vh;border:0;border-radius:0;padding:78px 24px 72px;box-shadow:none}.theme-toggle{top:20px;right:20px}.login-card{max-width:430px}.mobile-brand{display:flex}.login-heading p{margin-bottom:28px}.panel-bottom{left:24px;right:24px;bottom:22px}.login-footnote{margin-top:24px}}
@media(max-width:380px){.login-panel{padding-left:18px;padding-right:18px}.theme-toggle{right:16px}.panel-bottom{left:18px;right:18px}.theme-toggle{padding:9px 10px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;scroll-behavior:auto!important}}
</style>
