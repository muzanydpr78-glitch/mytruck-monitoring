<script>
(function () {
  'use strict';
  const $ = id => document.getElementById(id);
  const form = $('loginForm');
  const loginInput = $('loginInput');
  const passwordInput = $('passwordInput');
  const rememberInput = $('rememberInput');
  const message = $('message');
  const submitButton = $('submitButton');
  const submitText = $('submitText');
  const signedInPanel = $('signedInPanel');
  const sessionKey = 'wma_session_id';
  const rememberKey = 'wma_remember_token';
  const themeKey = 'wma_theme';
  let activeSessionId = '';
  let activeRememberToken = '';

  function applyTheme(theme) {
    const dark = theme === 'dark';
    document.body.classList.toggle('dark', dark);
    $('themeIcon').textContent = dark ? '☀' : '☾';
    $('themeLabel').textContent = dark ? 'Light mode' : 'Dark mode';
    try { localStorage.setItem(themeKey, dark ? 'dark' : 'light'); } catch (e) {}
  }
  function initTheme() {
    let saved = '';
    try { saved = localStorage.getItem(themeKey) || ''; } catch (e) {}
    applyTheme(saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  }
  $('themeToggle').addEventListener('click', () => applyTheme(document.body.classList.contains('dark') ? 'light' : 'dark'));

  $('togglePassword').addEventListener('click', () => {
    const show = passwordInput.type === 'password';
    passwordInput.type = show ? 'text' : 'password';
    $('togglePassword').textContent = show ? 'Sembunyikan' : 'Lihat';
    $('togglePassword').setAttribute('aria-label', show ? 'Sembunyikan password' : 'Tampilkan password');
  });

  function showMessage(text) { message.textContent = text || ''; }
  function setLoading(loading) {
    submitButton.disabled = loading;
    submitText.textContent = loading ? 'Memeriksa...' : 'Masuk';
  }
  function showSignedIn(user) {
    form.hidden = true;
    $('loginInput').parentElement.previousElementSibling && ($('loginInput').parentElement.previousElementSibling.hidden = true);
    $('passwordInput').parentElement.previousElementSibling && ($('passwordInput').parentElement.previousElementSibling.hidden = true);
    $('welcomeText').textContent = 'Selamat datang, ' + (user.username || 'pengguna') + '.';
    $('roleText').textContent = user.role || 'User';
    signedInPanel.hidden = false;
    showMessage('');
  }
  function showLogin() {
    form.hidden = false;
    signedInPanel.hidden = true;
  }
  function saveAuth(result) {
    activeSessionId = result.sessionId || '';
    activeRememberToken = result.rememberToken || activeRememberToken;
    try {
      if (activeSessionId) sessionStorage.setItem(sessionKey, activeSessionId);
      else sessionStorage.removeItem(sessionKey);
      if (activeRememberToken) localStorage.setItem(rememberKey, activeRememberToken);
      else if (!rememberInput.checked) localStorage.removeItem(rememberKey);
    } catch (e) {}
    showSignedIn(result.user || {});
  }

  form.addEventListener('submit', event => {
    event.preventDefault();
    showMessage('');
    const login = loginInput.value.trim();
    const password = passwordInput.value;
    if (!login || !password) {
      showMessage('Username/email dan password wajib diisi.');
      (!login ? loginInput : passwordInput).focus();
      return;
    }
    setLoading(true);
    google.script.run
      .withSuccessHandler(result => {
        setLoading(false);
        if (!result || !result.ok) {
          showMessage((result && result.message) || 'Login gagal. Silakan coba lagi.');
          return;
        }
        saveAuth(result);
      })
      .withFailureHandler(() => {
        setLoading(false);
        showMessage('Tidak dapat terhubung ke server. Periksa koneksi lalu coba lagi.');
      })
      .login({ login, password, remember: rememberInput.checked });
  });

  $('logoutButton').addEventListener('click', () => {
    const sessionId = activeSessionId || safeGet(sessionStorage, sessionKey);
    const rememberToken = activeRememberToken || safeGet(localStorage, rememberKey);
    google.script.run
      .withSuccessHandler(() => finishLogout())
      .withFailureHandler(() => finishLogout())
      .logout(sessionId, rememberToken);
  });

  function finishLogout() {
    try {
      sessionStorage.removeItem(sessionKey);
      localStorage.removeItem(rememberKey);
    } catch (e) {}
    activeSessionId = '';
    activeRememberToken = '';
    passwordInput.value = '';
    rememberInput.checked = false;
    showLogin();
    showMessage('Anda telah logout.');
  }
  function safeGet(store, key) { try { return store.getItem(key) || ''; } catch (e) { return ''; } }

  function restore() {
    const sessionId = safeGet(sessionStorage, sessionKey);
    const rememberToken = safeGet(localStorage, rememberKey);
    if (!sessionId && !rememberToken) return;
    google.script.run
      .withSuccessHandler(result => {
        if (result && result.ok) {
          activeSessionId = result.sessionId || sessionId;
          activeRememberToken = rememberToken;
          if (activeSessionId) {
            try { sessionStorage.setItem(sessionKey, activeSessionId); } catch (e) {}
          }
          showSignedIn(result.user || {});
        } else {
          try { sessionStorage.removeItem(sessionKey); } catch (e) {}
          // An invalid remember token is removed to avoid repeated restore attempts.
          if (rememberToken) {
            try { localStorage.removeItem(rememberKey); } catch (e) {}
          }
        }
      })
      .withFailureHandler(() => {})
      .restoreSession(sessionId, rememberToken);
  }

  initTheme();
  restore();
})();
</script>
